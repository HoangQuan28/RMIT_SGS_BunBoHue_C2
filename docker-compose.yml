version: '3.8'

services:
  unisign-forum:
    build:
      context: .
      dockerfile: Dockerfile
    image: unisign-forum:latest
    container_name: unisign_forum_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - sqlite_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/notifications"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sqlite_data:
